services:
  db:
    image: pgvector/pgvector:pg16
    container_name: chatbot-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-chatbot_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-chatbot_dev}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-chatbot_app} -d ${POSTGRES_DB:-chatbot_dev}"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

  backend:
    build:
      context: ./backend
    container_name: chatbot-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-chatbot_app}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-chatbot_dev}
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
      CORS_ORIGINS: '["http://localhost","http://127.0.0.1","http://localhost:${FRONTEND_PORT:-8080}","http://127.0.0.1:${FRONTEND_PORT:-8080}"]'
    volumes:
      - backend_storage:/app/storage
      - backend_data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: chatbot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "${FRONTEND_PORT:-8080}:80"

volumes:
  pgdata:
  backend_storage:
  backend_data:
