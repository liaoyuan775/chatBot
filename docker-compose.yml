services:
  backend:
    build:
      context: ./backend
    container_name: chatbot-backend
    restart: unless-stopped
    env_file:
      - ./.env.docker
    environment:
      APP_HOST: 0.0.0.0
      APP_PORT: 8000
    volumes:
      - backend_storage:/app/storage
      - backend_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5).read()\""]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    container_name: chatbot-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"

volumes:
  backend_storage:
  backend_data:
